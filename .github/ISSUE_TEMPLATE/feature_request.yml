name: Feature request
description: Suggest an improvement grounded in a user need.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What difficulty does this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe success without prescribing implementation.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Supporting context
      description: Research, examples, constraints, or alternatives considered.
